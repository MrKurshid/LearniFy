<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8A00" />
      <stop offset="50%" stop-color="#A3B318" />
      <stop offset="100%" stop-color="#646F00" />
    </linearGradient>
    <!-- Accent Sparkle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#C8D43A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Glowing Ring Orbit -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Graduation Cap Roof (Diamond) -->
  <path d="M 256 140 L 390 205 L 256 270 L 122 205 Z" fill="url(#accentGrad)" />

  <!-- Graduation Cap Base Bowl -->
  <path d="M 172 232 L 172 310 C 172 345, 340 345, 340 310 L 340 232" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tassel Cord & Hanging Ribbon -->
  <path d="M 360 220 L 390 280 L 390 325" fill="none" stroke="#C8D43A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="390" cy="335" r="12" fill="#C8D43A" />

  <!-- Bottom Accent Sphere Dot -->
  <circle cx="256" cy="380" r="16" fill="#C8D43A" />
</svg>
